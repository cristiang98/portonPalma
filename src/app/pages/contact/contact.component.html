<div class="contenedor1">
    <div class="row">
        <h1>Formulario de Contacto</h1>
    </div>
    <div class="pqrs-container">


        <form [formGroup]="contactForm1" (ngSubmit)="onSubmit()">
            <!-- Nombre -->
            <div>
                <label for="name">Nombre:</label>
                <input type="text" id="name" formControlName="name" placeholder="Tu Nombre" />
                <div *ngIf="contactForm1.get('name')?.invalid && contactForm1.get('name')?.touched">
                    <small class="error">Este campo es obligatorio</small>
                </div>
            </div>

            <!-- Email -->
            <div>
                <label for="email">Email:</label>
                <input type="email" id="email" formControlName="email" placeholder="Tu Email" />
                <div *ngIf="contactForm1.get('email')?.invalid && contactForm1.get('email')?.touched">
                    <small class="error">Este campo es obligatorio y debe ser un email válido</small>
                </div>
            </div>

            <!-- Teléfono -->
            <div>
                <label for="phone">Teléfono:</label>
                <input type="text" id="phone" formControlName="phone" placeholder="Tu Teléfono" />
                <div *ngIf="contactForm1.get('phone')?.invalid && contactForm1.get('phone')?.touched">
                    <small class="error">Este campo es obligatorio</small>
                </div>
            </div>

            <!-- Mensaje -->
            <div>
                <label for="message">Mensaje:</label>
                <textarea id="message" formControlName="message" placeholder="Tu Mensaje"></textarea>
                <div *ngIf="contactForm1.get('message')?.invalid && contactForm1.get('message')?.touched">
                    <small class="error">Este campo es obligatorio</small>
                </div>
            </div>

            <!-- Botón de Enviar -->
            <div>
                <button type="submit">Enviar</button>
            </div>
        </form>
    </div>
</div>
